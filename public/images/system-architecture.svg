<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#080C16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#080C18" />
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="colBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C33" />
      <stop offset="100%" stop-color="#0C1322" />
    </linearGradient>

    <linearGradient id="colOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24160F" />
      <stop offset="100%" stop-color="#140D0A" />
    </linearGradient>

    <linearGradient id="colGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F241C" />
      <stop offset="100%" stop-color="#0A1611" />
    </linearGradient>

    <linearGradient id="colPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1330" />
      <stop offset="100%" stop-color="#120A1E" />
    </linearGradient>

    <!-- Top Glow Rail -->
    <linearGradient id="topRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="35%" stop-color="#E35914" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Shadows & Filters -->
